[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-harness"
version = "0.1.55"
description = "Deterministic scheduler around Codex CLI worker agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Adam Zieliński", email = "adam@adamziel.com"}]

[project.scripts]
harness = "llm_harness.cli:main"

[project.optional-dependencies]
turso = ["pyturso>=0.6.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_harness*"]
